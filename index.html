<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADI stats</title>
    <meta name="description" content="A premium, local-first calendar dashboard to parse .ics files and analyze your schedules, deep work patterns, and time allocations." />
    
    <!-- PWA meta tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07090e" id="theme-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <script>
      // Automatically recover if a stale chunk/hash fails to load
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('Vite chunk preload error detected; auto-reloading fresh build...', event);
        window.location.reload();
      });

      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.onupdatefound = () => {
              const installing = reg.installing;
              if (installing) {
                installing.onstatechange = () => {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New version installed; auto-refreshing page.');
                    window.location.reload();
                  }
                };
              }
            };
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
